<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding Agent</title>
  <!-- marked 12.0.2 / DOMPurify 3.1.6 / highlight.js 11.9.0，本地托管避免 CDN 被墙 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/github-dark.min.css') }}">
  <script src="{{ url_for('static', filename='vendor/marked.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/purify.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/highlight.min.js') }}"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --border: #262a33;
      --text: #e6e8ee;
      --muted: #8b90a0;
      --accent: #4f8cff;
      --accent-hover: #6ea1ff;
      --user-bg: #1f2b45;
      --agent-bg: #1a1d24;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: radial-gradient(circle at 20% 0%, #1a1f2b 0%, var(--bg) 60%);
      color: var(--text);
    }
    body {
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .app {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 48px);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 4px 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f8cff, #a855f7);
      box-shadow: 0 0 12px rgba(79, 140, 255, 0.7);
    }
    .actions { display: flex; gap: 10px; align-items: center; }
    .btn-ghost {
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-ghost:hover {
      background: #1f232b;
      border-color: #3a4050;
    }
    .logout {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      padding: 8px 4px;
      transition: color 0.15s;
    }
    .logout:hover { color: var(--text); }

    .chat {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .chat::-webkit-scrollbar { width: 8px; }
    .chat::-webkit-scrollbar-thumb {
      background: #2a2f3a;
      border-radius: 4px;
    }
    .chat::-webkit-scrollbar-thumb:hover { background: #3a4050; }

    .msg {
      margin: 14px 0;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: white;
    }
    .avatar.user { background: linear-gradient(135deg, #4f8cff, #7bb0ff); }
    .avatar.agent { background: linear-gradient(135deg, #a855f7, #6d28d9); }
    .bubble {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: 14px;
    }
    .bubble.user {
      background: var(--user-bg);
      border: 1px solid #2b3a5c;
    }
    .bubble .stats {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      white-space: normal;
    }
    .bubble.agent {
      background: var(--agent-bg);
      border: 1px solid var(--border);
    }

    /* Markdown 渲染后的样式 */
    .bubble.md { white-space: normal; }
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 8px 0; }
    .md h1, .md h2, .md h3, .md h4 { margin: 14px 0 8px; line-height: 1.35; }
    .md h1 { font-size: 20px; }
    .md h2 { font-size: 18px; }
    .md h3 { font-size: 16px; }
    .md h4 { font-size: 14px; }
    .md ul, .md ol { padding-left: 22px; }
    .md li { margin: 3px 0; }
    .md a { color: var(--accent-hover); }
    .md blockquote {
      padding: 2px 12px;
      color: var(--muted);
      border-left: 3px solid #3a4050;
    }
    .md code {
      font-family: Consolas, "JetBrains Mono", Menlo, monospace;
      font-size: 13px;
      padding: 2px 5px;
      background: #262a33;
      border-radius: 4px;
    }
    .md pre {
      padding: 12px 14px;
      overflow-x: auto;
      background: #0d1017;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .md pre code {
      padding: 0;
      background: none;
      font-size: 13px;
      line-height: 1.5;
    }
    .md pre code.hljs { padding: 0; background: none; }
    .md table { border-collapse: collapse; display: block; overflow-x: auto; }
    .md th, .md td { padding: 6px 10px; border: 1px solid var(--border); }
    .md th { background: #1f232b; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

    .composer {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .composer:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.15);
    }
    #task {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      padding: 8px 10px;
    }
    #task::placeholder { color: var(--muted); }
    #send {
      padding: 10px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    #send:hover:not(:disabled) { background: var(--accent-hover); }
    #send:active:not(:disabled) { transform: scale(0.98); }
    #send:disabled { background: #3a4050; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="brand-dot"></div>
        <span>Coding Agent</span>
      </div>
      <div class="actions">
        <button class="btn-ghost" onclick="newSession()">新会话</button>
        <a class="logout" href="/logout">退出登录</a>
      </div>
    </div>

    <div id="messages" class="chat"></div>

    <div class="composer">
      <input id="task" placeholder="输入任务，例如：创建 hello.py 并运行" autocomplete="off" />
      <button id="send" onclick="send()">发送</button>
    </div>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("task");
    const sendBtn = document.getElementById("send");

    function append(role, text) {
      const row = document.createElement("div");
      row.className = "msg " + role;

      const avatar = document.createElement("div");
      avatar.className = "avatar " + role;
      avatar.textContent = role === "user" ? "你" : "AI";

      const bubble = document.createElement("div");
      bubble.className = "bubble " + role;
      bubble.textContent = text;

      row.appendChild(avatar);
      row.appendChild(bubble);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    // 在回答下方显示本次任务的 token 消耗等统计
    function showStats(bubble, s) {
      const meta = document.createElement("div");
      meta.className = "stats";
      let text = `${s.steps} 步 · tokens ${s.total_tokens}（输入 ${s.prompt_tokens} / 输出 ${s.completion_tokens}）· 耗时 ${s.seconds}s`;
      if (s.rag_hits && s.rag_hits.length) text += ` · 知识库命中 ${s.rag_hits.length} 条`;
      meta.textContent = text;
      if (s.rag_hits && s.rag_hits.length) meta.title = s.rag_hits.join("\n");
      bubble.appendChild(meta);
      messages.scrollTop = messages.scrollHeight;
    }

    // 把 Markdown 渲染进气泡；CDN 没加载成功时退回纯文本
    function renderMarkdown(bubble, text) {
      if (!window.marked || !window.DOMPurify) {
        bubble.textContent = text;
        return;
      }
      // 模型输出可能夹带文件里的 HTML，必须先消毒再插入，防止 XSS
      bubble.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
      bubble.classList.add("md");
      bubble.querySelectorAll("a").forEach((a) => {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      });
      if (window.hljs) {
        bubble.querySelectorAll("pre code").forEach((el) => hljs.highlightElement(el));
      }
      messages.scrollTop = messages.scrollHeight;
    }

    async function send() {
      const task = input.value.trim();
      if (!task || sendBtn.disabled) return;

      append("user", task);
      input.value = "";
      sendBtn.disabled = true;
      const bubble = append("agent", "思考中……");

      try {
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task }),
        });
        if (resp.redirected || resp.url.includes("/login")) {
          bubble.textContent = "登录已失效，请刷新页面重新登录。";
          return;
        }
        let data;
        try {
          data = await resp.json();
        } catch {
          bubble.textContent = `服务器返回异常（HTTP ${resp.status}），可能是请求超时。`;
          return;
        }
        if (data.result) {
          renderMarkdown(bubble, data.result);
          if (data.stats) showStats(bubble, data.stats);
        } else {
          bubble.textContent = data.error || "无输出";
        }
      } catch (e) {
        bubble.textContent = "请求失败：" + e;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    async function newSession() {
      if (!confirm("确定要开启新会话吗？当前对话历史将被清空。")) return;
      await fetch("/api/new_session", { method: "POST" });
      messages.innerHTML = "";
      append("agent", "已开启新会话。");
      input.focus();
    }

    input.addEventListener("keydown", (e) => {
      // 中文输入法选词时按回车不应发送
      if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) send();
    });

    input.focus();
  </script>
</body>
</html>
