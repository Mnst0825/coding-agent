<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · Coding Agent</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --border: #262a33;
      --text: #e6e8ee;
      --muted: #8b90a0;
      --accent: #4f8cff;
      --accent-hover: #6ea1ff;
      --error: #ff5c5c;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: radial-gradient(circle at 20% 0%, #1a1f2b 0%, var(--bg) 60%);
      color: var(--text);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .logo-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f8cff, #a855f7);
      box-shadow: 0 0 12px rgba(79, 140, 255, 0.7);
    }
    h1 {
      font-size: 20px;
      margin: 0 0 4px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input[type=password] {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text);
      background: #12151c;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type=password]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.18);
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      color: white;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.99); }
    .error {
      color: var(--error);
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
    }
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-dot"></div>
      <h1>Coding Agent</h1>
    </div>
    <div class="subtitle">请输入访问密码以继续</div>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post">
      <label for="password">密码</label>
      <input id="password" type="password" name="password" placeholder="••••••••" autofocus autocomplete="current-password" />
      <button type="submit">进入</button>
    </form>

    <div class="footer">个人项目 · 仅供演示</div>
  </div>
</body>
</html>
